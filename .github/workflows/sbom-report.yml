name: Generate and Publish SBOM and Vulnerability Report

on:
  push:
    branches:
      - main

jobs:
  sbom-html-report:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Install Syft
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      # Step 3: Install Grype
      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      # Step 4: Install CycloneDX CLI (to convert SBOM to HTML)
      - name: Install CycloneDX CLI
        run: |
          curl -sSfL https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.30.1/cyclonedx-linux-x64.tar.gz | tar -xz
          mv cyclonedx /usr/local/bin/

      # Step 5: Generate SBOM with Syft in CycloneDX format
      - name: Generate SBOM (CycloneDX)
        run: |
          syft . -o cyclonedx-json > sbom.cyclonedx.json

      # Step 6: Convert SBOM to HTML
      - name: Convert SBOM to HTML
        run: |
          cyclonedx convert --input-file sbom.cyclonedx.json --output-format html --output-file sbom.html

      # Step 7: Scan for Vulnerabilities with Grype
      - name: Scan for Vulnerabilities
        run: |
          grype sbom:sbom.cyclonedx.json -o table > vulnerabilities.html

      # Step 8: Prepare Pages Directory
      - name: Prepare Pages Directory
        run: |
          mkdir -p pages
          mv sbom.cyclonedx.json pages/sbom.json
          mv sbom.html pages/sbom.html
          mv vulnerabilities.html pages/index.html

      # Step 9: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages
