name: Generate and Publish SBOM HTML Report

on:
  push:
    branches:
      - main

jobs:
  sbom-html-report:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Install Syft
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      # Step 3: Install Grype
      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      # Step 4: Generate SBOM with Syft in CycloneDX format
      - name: Generate SBOM (CycloneDX)
        run: |
          syft . -o cyclonedx-json > sbom.cyclonedx.json

      # Step 5: Scan for Vulnerabilities with Grype
      - name: Scan for Vulnerabilities
        run: |
          grype sbom:sbom.cyclonedx.json -o table > vulnerabilities.html

      # Step 6: Prepare HTML report directory
      - name: Prepare Pages Directory
        run: |
          mkdir -p pages
          mv sbom.cyclonedx.json pages/sbom.json
          mv vulnerabilities.html pages/index.html

      # Step 7: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages
