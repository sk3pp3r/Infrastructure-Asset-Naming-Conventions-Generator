name: Generate and Publish SBOM HTML Report Master

on:
  push:
    branches:
      - main

jobs:
  sbom-html-report:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Install Syft
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      # Step 3: Create Go Template for HTML Output
      - name: Create HTML Template
        run: |
          cat <<EOF > sbom-template.tmpl
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>SBOM Report</title>
              <style>
                  body { font-family: Arial, sans-serif; line-height: 1.6; margin: 20px; }
                  table { border-collapse: collapse; width: 100%; }
                  th, td { border: 1px solid #ddd; padding: 8px; }
                  th { background-color: #f4f4f4; text-align: left; }
              </style>
          </head>
          <body>
              <h1>Software Bill of Materials (SBOM)</h1>
              <h2>Source: {{ .Source }}</h2>
              <h3>Packages</h3>
              <table>
                  <thead>
                      <tr>
                          <th>Name</th>
                          <th>Version</th>
                          <th>Type</th>
                      </tr>
                  </thead>
                  <tbody>
                  {{ range .Artifacts }}
                      <tr>
                          <td>{{ .Name }}</td>
                          <td>{{ .Version }}</td>
                          <td>{{ .Type }}</td>
                      </tr>
                  {{ end }}
                  </tbody>
              </table>
          </body>
          </html>
          EOF

      # Step 4: Generate SBOM as HTML
      - name: Generate SBOM as HTML
        run: |
          syft . -o template=sbom-template.tmpl > sbom.html

      # Step 5: Prepare Pages Directory
      - name: Prepare Pages Directory
        run: |
          mkdir -p pages
          mv sbom.html pages/index.html

      # Step 6: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages
